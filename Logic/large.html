<script>
    let a = 10, b = 25, c = 15;
    let large;

    if (a > b) {
        if (a > c) {
            large = a;
        } else {
            large = c;
        }
    } else {
        if (b > c) {
            large = b;
        } else {
            large = c;
        }
    }

    console.log(`the largest number is : ${large}`);
</script>
